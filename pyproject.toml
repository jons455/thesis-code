[tool.poetry]
name = "pmsm-neuromorphic-benchmark"
version = "0.1.0"
package-mode = false
description = "Neuromorphic controller benchmark for PMSM current control"
readme = "README.md"
authors = ["Jonas <jonas@example.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

# Core scientific computing
numpy = ">=2.0.0"
pandas = ">=2.0.0"
scipy = ">=1.10.0"
matplotlib = ">=3.7.0"

# GEM (gym-electric-motor) simulation
gym-electric-motor = ">=3.0.0"
gymnasium = ">=0.29.0"

# Deep learning
torch = ">=2.0.0"
snntorch = ">=0.9.0"

# Data processing
pyarrow = ">=12.0.0"
seaborn = ">=0.12.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
pre-commit = ">=3.6.0"
ruff = ">=0.3.0"
mypy = ">=1.8.0"

[tool.poetry.group.jupyter.dependencies]
jupyter = ">=1.0.0"
ipykernel = ">=6.25.0"

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["embark/tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# =============================================================================
# Ruff Configuration (Linting + Formatting)
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".mypy_cache",
    ".pytest_cache",
    "evaluation/data-preperation/data_exploration.ipynb",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # use ternary operator instead of if-else
]

[tool.ruff.lint.isort]
known-first-party = ["embark", "evaluation"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# =============================================================================
# MyPy Configuration (Type Checking)
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true
exclude = [
    "embark/tests/",
    "docs/",
    "build/",
]

[[tool.mypy.overrides]]
module = [
    "gym_electric_motor.*",
    "snntorch.*",
    "gymnasium.*",
]
ignore_missing_imports = true
