[tool.poetry]
name = "embark"
version = "0.1.0"
description = "End-to-end motor benchmark: PI vs SNN control for PMSM"
authors = ["Jonas Reif"]
readme = "README.md"
packages = [{include = "embark"}]

[tool.poetry.dependencies]
python = ">=3.10"
numpy = ">=1.26.0,<2.2.0"
pandas = "^2.0.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
scipy = "^1.10.0"
torch = "^2.0.0"
tqdm = "^4.65.0"
gymnasium = "^0.29.1"
gym-electric-motor = "^3.0.3"
stable-baselines3 = "^2.0.0"
snntorch = "^0.9.1"

[tool.poetry.group.neurobench.dependencies]
neurobench = {git = "https://github.com/NeuroBench/neurobench.git", branch = "2025_GC"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
black = "^23.3.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
pre-commit = "^3.3.0"
mypy = "^1.3.0"
sphinx = "^7.0.0"
sphinx-rtd-theme = "^2.0.0"
sphinx-autodoc-typehints = "^2.0.0"



# GPU machine: uncomment to install PyTorch with CUDA 12.4
# [[tool.poetry.source]]
# name = "pytorch-gpu"
# url = "https://download.pytorch.org/whl/cu124"
# priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.poetry.group.akida.dependencies]
akida = "2.18.2"
cnn2snn = "2.18.2"
quantizeml = "1.1.1"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
disallow_untyped_defs = false
show_error_codes = true
exclude = ["examples/", "src/embark/pmsm-pem/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "hardware: marks tests requiring hardware (Akida, etc.)",
    "neurobench: marks tests requiring neurobench package",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
