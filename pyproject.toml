[tool.poetry]
name = "pmsm-neuromorphic-benchmark"
version = "0.1.0"
description = "Benchmarking PI vs SNN control for PMSM"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "embark"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "^1.24.0"
pandas = "^2.0.0"
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
scipy = "^1.10.0"
torch = "^2.0.0"
tqdm = "^4.65.0"
gymnasium = "^0.28.1"
stable-baselines3 = "^2.0.0"
snntorch = "^0.9.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
black = "^23.3.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
pre-commit = "^3.3.0"
mypy = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
